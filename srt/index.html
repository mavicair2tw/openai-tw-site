<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

<body class="bg-neutral-950 text-neutral-100">
<div id="root"></div>

<script type="text/babel">
const { useState, useCallback, useRef } = React;

// ─── LANGUAGES ───
const LANGUAGES = [
  { code: "en",    label: "English",  flag: "🇺🇸" },
  { code: "zh-TW", label: "繁體中文", flag: "🇹🇼" },
  { code: "ja",    label: "日本語",   flag: "🇯🇵" },

// ─── SIMULATED TRANSCRIPT ───
// SIMULATED: Replace simulateTranscript() with a real backend call
// (e.g. youtube-transcript npm pkg via a proxy) when a server is available.
function simulateTranscript(videoId) {
  return [
    { start: 0,    duration: 3,   text: "Welcome to this video." },
    { start: 3,    duration: 4,   text: "Today we're going to explore something fascinating." },
    { start: 7,    duration: 3.5, text: "Let's start with the basics." },
    { start: 10.5, duration: 4,   text: "There are many ways to approach this topic." },
    { start: 14.5, duration: 3,   text: "First, let's understand the fundamentals." },
    { start: 17.5, duration: 4.5, text: "This concept has been around for decades." },
    { start: 22,   duration: 3,   text: "Many experts have studied this extensively." },
    { start: 25,   duration: 4,   text: "The results have been quite surprising." },

    { start: 51,   duration: 3.5, text: "Let's summarize what we've learned so far." },
    { start: 54.5, duration: 4,   text: "Thank you so much for watching this video." },
    { start: 58.5, duration: 3,   text: "Please like and subscribe for more content." },
    { start: 61.5, duration: 3.5, text: "See you in the next one!" },
  ];
}

// ─── MOCK TRANSLATION ───
// MOCK: Replace translate() body with real API call:
//   OpenAI: POST https://api.openai.com/v1/chat/completions
//   DeepL:  POST https://api-free.deepl.com/v2/translate
// Signature stays: translate(text, targetLang) → Promise<string>
const ZH_TW = {
  "Welcome to this video.": "歡迎收看本影片。",
  "Today we're going to explore something fascinating.": "今天我們將探索一些令人著迷的事物。",
  "Let's start with the basics.": "讓我們從基礎開始。",
  "There are many ways to approach this topic.": "有許多方式可以探討這個主題。",
  "First, let's understand the fundamentals.": "首先，讓我們了解基本概念。",
  "This concept has been around for decades.": "這個概念已存在數十年之久。",
  "Many experts have studied this extensively.": "許多專家已對此進行深入研究。",
  "The results have been quite surprising.": "研究結果相當令人驚訝。",
  "Let me show you some examples.": "讓我為您展示一些例子。",
  "As you can see, this is quite remarkable.": "如您所見，這相當值得注目。",
  "Now let's move on to the next part.": "現在讓我們進入下一個部分。",
  "This section covers the more advanced aspects.": "本節涵蓋更進階的層面。",
  "Don't worry if this seems complex at first.": "如果一開始覺得複雜，請不要擔心。",
  "With practice, it becomes much easier to understand.": "經過練習，理解起來會容易得多。",
  "Let's summarize what we've learned so far.": "讓我們總結一下目前所學的內容。",
  "Thank you so much for watching this video.": "非常感謝您收看本影片。",
  "Please like and subscribe for more content.": "請按讚並訂閱以獲取更多內容。",
  "See you in the next one!": "下次見！",
};
const JA = {
  "Welcome to this video.": "この動画へようこそ。",
  "Today we're going to explore something fascinating.": "今日は魅力的なことを探っていきましょう。",
  "Let's start with the basics.": "基本から始めましょう。",
  "There are many ways to approach this topic.": "このトピックへのアプローチ方法はたくさんあります。",
  "First, let's understand the fundamentals.": "まず、基本的な概念を理解しましょう。",
  "This concept has been around for decades.": "この概念は数十年前から存在しています。",
  "Many experts have studied this extensively.": "多くの専門家がこれを徹底的に研究してきました。",
  "The results have been quite surprising.": "結果はかなり驚くべきものでした。",
  "Let me show you some examples.": "いくつかの例をご紹介します。",
  "As you can see, this is quite remarkable.": "ご覧の通り、これは非常に注目すべきことです。",
  "Now let's move on to the next part.": "では、次のパートに進みましょう。",
  "This section covers the more advanced aspects.": "このセクションでは、より高度な側面をカバーします。",
  "Don't worry if this seems complex at first.": "最初は複雑に見えても心配しないでください。",
  "With practice, it becomes much easier to understand.": "練習すれば、理解するのがずっと簡単になります。",
  "Let's summarize what we've learned so far.": "これまでに学んだことをまとめましょう。",
  "Thank you so much for watching this video.": "この動画をご視聴いただきありがとうございます。",
  "Please like and subscribe for more content.": "さらなるコンテンツのために、いいねと登録をお願いします。",
  "See you in the next one!": "次の動画でお会いしましょう！",
};

async function translate(text, lang) {
  await new Promise(r => setTimeout(r, 8));
  if (lang === "zh-TW") return ZH_TW[text] || `[ZH] ${text}`;
  if (lang === "ja")    return JA[text]    || `[JA] ${text}`;
  return text;
}

// ─── SRT UTILS ───
function toSrtTs(sec) {
  const h  = Math.floor(sec / 3600);
  const m  = Math.floor((sec % 3600) / 60);
  const s  = Math.floor(sec % 60);
  const ms = Math.round((sec % 1) * 1000);
  return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")},${String(ms).padStart(3,"0")}`;
}
function buildSrt(segs) {
  return segs.map((s, i) =>
    `${i+1}\n${toSrtTs(s.start)} --> ${toSrtTs(s.start + s.duration)}\n${s.text}\n`
  ).join("\n");
}

// ─── YOUTUBE URL ───
function extractVideoId(url) {
  try {
    const u = new URL(url.trim());
    if (u.hostname.includes("youtu.be")) return u.pathname.slice(1).split("?")[0];
    return u.searchParams.get("v") || null;
  } catch { return null; }
}

// ─── ICONS ───
const DlIcon = () => (
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
  </svg>
);
const CpIcon = () => (
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
    <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
  </svg>
);
const OkIcon = () => (
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
    <polyline points="20 6 9 17 4 12"/>
  </svg>
);
const MoonIcon = () => (
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
  </svg>
);
const SunIcon = () => (
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
    <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
  </svg>
);
const YTIcon = () => (
  <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
    <path d="M22.54 6.42a2.78 2.78 0 0 0-1.95-1.96C18.88 4 12 4 12 4s-6.88 0-8.59.46A2.78 2.78 0 0 0 1.46 6.42 29 29 0 0 0 1 12a29 29 0 0 0 .46 5.58a2.78 2.78 0 0 0 1.95 1.96C5.12 20 12 20 12 20s6.88 0 8.59-.46a2.78 2.78 0 0 0 1.95-1.96A29 29 0 0 0 23 12a29 29 0 0 0-.46-5.58z"/>
    <polygon points="9.75 15.02 15.5 12 9.75 8.98 9.75 15.02" fill="white"/>
  </svg>
);

// ─── COPY BUTTON ───
function CopyBtn({ text }) {
  const [ok, setOk] = useState(false);
  const handle = async () => {
    await navigator.clipboard.writeText(text);
    setOk(true); setTimeout(() => setOk(false), 2000);
  };
  return (
    <button onClick={handle}
      className={`inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium transition-all
        ${ok ? "bg-emerald-900/50 text-emerald-400" : "bg-neutral-800 hover:bg-neutral-700 text-neutral-300"}`}>
      {ok ? <OkIcon/> : <CpIcon/>} {ok ? "Copied!" : "Copy"}
    </button>
  );
}

// ─── APP ───
function App() {
  const [dark, setDark]       = useState(true);
  const [url, setUrl]         = useState("");
  const [title, setTitle]     = useState("subtitles");
  const [loading, setLoading] = useState(false);
  const [error, setError]     = useState("");
  const [results, setResults] = useState(null);
  const [srtMap, setSrtMap]   = useState({});
  const [tab, setTab]         = useState("en");

  const generate = useCallback(async () => {
    setError(""); setResults(null); setSrtMap({});
    const id = extractVideoId(url);
    if (!id) { setError("Invalid YouTube URL. Please check the link and try again."); return; }
    setLoading(true);
    try {
      await new Promise(r => setTimeout(r, 800));
      const raw = simulateTranscript(id);
      const out = {}; const srts = {};
      await Promise.all(LANGUAGES.map(async ({ code }) => {
        const segs = await Promise.all(raw.map(async s => ({ ...s, text: await translate(s.text, code) })));
        out[code] = segs; srts[code] = buildSrt(segs);
      }));
      setResults(out); setSrtMap(srts); setTab("en");
    } catch { setError("Something went wrong. Please try again."); }
    finally { setLoading(false); }
  }, [url]);

  const download = (code) => {
    const blob = new Blob([srtMap[code] || ""], { type: "text/plain;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `${(title.trim() || "subtitles")}_${code}.srt`;
    a.click(); URL.revokeObjectURL(a.href);
  };

  return (
    <div className={dark ? "dark" : ""}>
      <div className="min-h-screen bg-neutral-50 dark:bg-neutral-950 text-neutral-900 dark:text-neutral-100 transition-colors duration-300">

        {/* HEADER */}
        <header className="sticky top-0 z-10 border-b border-neutral-200 dark:border-neutral-800 bg-white/80 dark:bg-neutral-900/80 backdrop-blur">
          <div className="max-w-2xl mx-auto px-4 h-14 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <a href="/" className="flex items-center gap-2 text-neutral-500 dark:text-neutral-400 hover:text-neutral-700 dark:hover:text-neutral-200 text-xs transition-colors">
                ← Home
              </a>
              <span className="text-neutral-300 dark:text-neutral-700">|</span>
              <div className="flex items-center gap-2">
                <span className="text-red-500"><YTIcon/></span>
                <span className="font-semibold text-sm">SRT Generator</span>
                <span className="text-[10px] font-mono bg-neutral-100 dark:bg-neutral-800 text-neutral-400 px-2 py-0.5 rounded-full">BETA</span>
              </div>
            </div>
            <button onClick={() => setDark(d => !d)}
              className="w-8 h-8 rounded-lg flex items-center justify-center text-neutral-400 hover:bg-neutral-100 dark:hover:bg-neutral-800 transition-colors">
              {dark ? <SunIcon/> : <MoonIcon/>}
            </button>
          </div>
        </header>

        {/* MAIN */}
        <main className="max-w-2xl mx-auto px-4 py-10 space-y-6">

          <div>
            <h1 className="text-2xl font-bold tracking-tight mb-1">YouTube Subtitle Generator</h1>
            <p className="text-sm text-neutral-500 dark:text-neutral-400">Paste a YouTube URL to generate and export SRT subtitle files in multiple languages.</p>
          </div>

          {/* INPUT CARD */}
          <div className="bg-white dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-800 rounded-2xl p-5 space-y-4 shadow-sm">

            <div className="space-y-1.5">
              <label className="text-[11px] font-semibold text-neutral-400 uppercase tracking-widest">YouTube URL</label>
              <input type="url" value={url}
                onChange={e => setUrl(e.target.value)}
                onKeyDown={e => e.key === "Enter" && generate()}
                placeholder="https://www.youtube.com/watch?v=..."
                className="w-full px-3.5 py-2.5 rounded-xl bg-neutral-50 dark:bg-neutral-800 border border-neutral-200 dark:border-neutral-700 text-sm placeholder:text-neutral-400 dark:placeholder:text-neutral-600 focus:outline-none focus:ring-2 focus:ring-red-500/40 focus:border-red-500 transition-all"
              />
            </div>

            <div className="space-y-1.5">
              <label className="text-[11px] font-semibold text-neutral-400 uppercase tracking-widest">Filename Prefix</label>
              <input type="text" value={title}
                onChange={e => setTitle(e.target.value)}
                placeholder="subtitles"
                className="w-full px-3.5 py-2.5 rounded-xl bg-neutral-50 dark:bg-neutral-800 border border-neutral-200 dark:border-neutral-700 text-sm placeholder:text-neutral-400 dark:placeholder:text-neutral-600 focus:outline-none focus:ring-2 focus:ring-red-500/40 focus:border-red-500 transition-all"
              />
              <p className="text-[11px] text-neutral-400 dark:text-neutral-600 font-mono">
                → {title||"subtitles"}_en.srt · {title||"subtitles"}_zh-TW.srt · {title||"subtitles"}_ja.srt
              </p>
            </div>

            <button onClick={generate} disabled={loading || !url.trim()}
              className="w-full py-2.5 rounded-xl bg-red-500 hover:bg-red-600 disabled:bg-neutral-200 dark:disabled:bg-neutral-800 disabled:text-neutral-400 dark:disabled:text-neutral-600 text-white font-semibold text-sm transition-all flex items-center justify-center gap-2 shadow-sm">
              {loading
                ? <><div className="w-4 h-4 rounded-full border-2 border-white/30 border-t-white spin"/>Generating…</>
                : "Generate Subtitles"}
            </button>

            <p className="text-[11px] text-center text-neutral-400 dark:text-neutral-600">
              ⚠️ Transcript data is <strong>simulated</strong> in this demo. A real backend is needed for actual transcripts.
            </p>
          </div>

          {/* ERROR */}
          {error && (
            <div className="bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-900 rounded-xl px-4 py-3 text-sm text-red-700 dark:text-red-400">
              {error}
            </div>
          )}

          {/* LOADING */}
          {loading && (
            <div className="flex items-center justify-center gap-3 py-14">
              <div className="relative w-9 h-9">
                <div className="absolute inset-0 rounded-full border-2 border-neutral-200 dark:border-neutral-800"/>
                <div className="absolute inset-0 rounded-full border-2 border-transparent border-t-red-500 spin"/>
              </div>
              <span className="text-sm text-neutral-400 font-mono">Processing transcript…</span>
            </div>
          )}

          {/* RESULTS */}
          {results && !loading && (
            <div className="bg-white dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-800 rounded-2xl shadow-sm overflow-hidden">

              {/* Tabs */}
              <div className="flex border-b border-neutral-200 dark:border-neutral-800">
                {LANGUAGES.map(l => (
                  <button key={l.code} onClick={() => setTab(l.code)}
                    className={`flex-1 py-3 text-sm font-medium flex items-center justify-center gap-1.5 transition-colors
                      ${tab === l.code
                        ? "border-b-2 border-red-500 text-red-500 dark:text-red-400 bg-red-50/40 dark:bg-red-950/20"
                        : "text-neutral-400 hover:text-neutral-700 dark:hover:text-neutral-200 hover:bg-neutral-50 dark:hover:bg-neutral-800/50"}`}>
                    <span>{l.flag}</span>
                    <span className="hidden sm:inline">{l.label}</span>
                    <span className="sm:hidden text-[11px] font-mono">{l.code}</span>
                  </button>
                ))}
              </div>

              {/* Tab pane */}
              {LANGUAGES.map(l => tab === l.code && (
                <div key={l.code} className="p-5 space-y-3">
                  <div className="flex items-center justify-between">
                    <span className="text-[11px] text-neutral-400 font-mono">{results[l.code]?.length} segments</span>
                    <div className="flex gap-2">
                      <CopyBtn text={srtMap[l.code]||""}/>
                      <button onClick={() => download(l.code)}
                        className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-neutral-900 hover:bg-neutral-700 dark:bg-white dark:hover:bg-neutral-200 text-white dark:text-neutral-900 transition-colors">
                        <DlIcon/> Download .srt
                      </button>
                    </div>
                  </div>
                  <textarea
                    value={srtMap[l.code]||""}
                    onChange={e => setSrtMap(p => ({...p, [l.code]: e.target.value}))}
                    className="w-full h-72 px-4 py-3 rounded-xl bg-neutral-50 dark:bg-neutral-950 border border-neutral-200 dark:border-neutral-800 text-xs font-mono leading-relaxed resize-y focus:outline-none focus:ring-2 focus:ring-red-500/30 focus:border-red-500 transition-all text-neutral-700 dark:text-neutral-300"
                    spellCheck={false}
                  />
                  <p className="text-[11px] text-neutral-400 dark:text-neutral-600">Editable — changes apply to copy &amp; download.</p>
                </div>
              ))}

              {/* Download all */}
              <div className="px-5 pb-5">
                <button onClick={() => LANGUAGES.forEach(l => download(l.code))}
                  className="w-full py-2.5 rounded-xl border border-neutral-200 dark:border-neutral-700 text-sm font-medium text-neutral-500 dark:text-neutral-400 hover:bg-neutral-50 dark:hover:bg-neutral-800 transition-colors flex items-center justify-center gap-2">
                  <DlIcon/> Download All 3 Languages
                </button>
              </div>
            </div>
          )}
        </main>

        <footer className="max-w-2xl mx-auto px-4 py-8 border-t border-neutral-200 dark:border-neutral-800">
          <p className="text-[11px] text-center text-neutral-400 dark:text-neutral-600">
            OpenClaw Market Hub · SRT Generator · Client-side only · No data sent to any server
          </p>
        </footer>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
