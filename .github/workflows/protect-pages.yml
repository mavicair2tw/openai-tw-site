name: Protect Custom Pages

on:
  push:
    branches: [main]

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.WORKFLOW_TOKEN }}

      - name: Restore protected files and homepage cards
        run: |
          git config user.name "page-protector"
          git config user.email "protect@openai-tw.com"

          # ── 1. Restore missing protected files ──
          for PROTECTED in "etf/index.html" "五子棋/index.html" "english/index.html" "srt/index.html"; do
            if [ ! -f "$PROTECTED" ]; then
              echo "Missing: $PROTECTED — restoring..."
              DIR=$(dirname "$PROTECTED")
              COMMIT=$(git log --all --diff-filter=AM --oneline -- "$PROTECTED" | head -1 | awk '{print $1}')
              if [ -n "$COMMIT" ]; then
                mkdir -p "$DIR"
                git show "$COMMIT":"$PROTECTED" > "$PROTECTED"
                git add "$PROTECTED"
                echo "Restored $PROTECTED from $COMMIT"
              else
                echo "Could not find a good commit for $PROTECTED"
              fi
            fi
          done

          # ── 2. Restore missing homepage cards ──
          python3 - << 'PYEOF'
import re, sys
content = open('index.html').read()
CARDS = '''        <a class="card" href="/etf/">
          <div class="name">ETF 投資工具</div>
          <div class="desc">配息試算、投資組合分析與 ETF 比較</div>
        </a>
        <a class="card" href="/五子棋/">
          <div class="name">五子棋 AI 對戰</div>
          <div class="desc">與 AI 對弈五子棋，四種難度，支援音效與悔棋</div>
        </a>
        <a class="card" href="/english/">
          <div class="name">🎓 AI School 英語學習</div>
          <div class="desc">英語、日語單字練習，雲端記錄，排行榜競賽</div>
        </a>
        <a class="card" href="/srt/">
          <div class="name">🎬 SRT 字幕產生器</div>
          <div class="desc">上傳影片自動生成 SRT 字幕，支援多語言</div>
        </a>'''
missing = []
if '/etf/' not in content: missing.append('etf')
if '五子棋' not in content: missing.append('五子棋')
if '/english/' not in content: missing.append('english')
if '/srt/' not in content: missing.append('srt')
if missing:
    print(f"Homepage missing cards: {missing}")
    new_content = re.sub(
        r'<section class="featured-grid">.*?</section>',
        '<section class="featured-grid">\n' + CARDS + '\n      </section>',
        content, flags=re.DOTALL
    )
    if new_content != content:
        open('index.html', 'w').write(new_content)
        print('featured-grid restored')
        sys.exit(2)
    else:
        print('WARNING: could not find featured-grid to patch')
        sys.exit(0)
else:
    print('All homepage cards present - no action needed')
    sys.exit(0)
PYEOF

          PY_EXIT=$?
          if [ $PY_EXIT -eq 2 ]; then
            git add index.html
          fi

          # ── 3. Commit & push if anything staged ──
          if ! git diff --cached --quiet; then
            git commit -m "auto-restore: protected pages and homepage cards [skip ci]"
            git push
            echo "Pushed restore commit"
          else
            echo "Nothing to restore - all good"
          fi
