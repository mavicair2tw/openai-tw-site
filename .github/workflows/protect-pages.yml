name: Protect Custom Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore protected pages
        run: |
          LAST_AUTHOR=$(git log -1 --format='%an')
          if [ "$LAST_AUTHOR" = "page-protector" ]; then
            echo "Skipping own commit"
            exit 0
          fi

          git config user.name "page-protector"
          git config user.email "protect@openai-tw.com"

          for F in "english/index.html" "srt/index.html" "etf/index.html" "五子棋/index.html"; do
            if [ ! -f "$F" ]; then
              echo "MISSING: $F"
              mkdir -p "$(dirname "$F")"
              git show origin/protected-pages:"$F" > "$F" 2>/dev/null && git add "$F" && echo "Restored: $F"
            fi
          done

          python3 - << 'PYEOF'
import re, sys
c = open('index.html').read()
missing = [n for p,n in [('/etf/','etf'),('/english/','english'),('/srt/','srt'),('五子棋','gomoku')] if p not in c]
if not missing:
    print('All cards present')
    sys.exit(0)
BLOCK = '''        <a class="card" href="/etf/">
          <div class="name">ETF 投資工具</div>
          <div class="desc">配息試算、投資組合分析與 ETF 比較</div>
        </a>
        <a class="card" href="/五子棋/">
          <div class="name">五子棋 AI 對戰</div>
          <div class="desc">與 AI 對弈五子棋，四種難度，支援音效與悔棋</div>
        </a>
        <a class="card" href="/english/">
          <div class="name">🎓 AI School 英語學習</div>
          <div class="desc">英語、日語單字練習，雲端記錄，排行榜競賽</div>
        </a>
        <a class="card" href="/srt/">
          <div class="name">🎬 SRT 字幕產生器</div>
          <div class="desc">上傳影片自動生成 SRT 字幕，支援多語言</div>
        </a>'''
new = re.sub(r'<section class="featured-grid">.*?</section>',
    '<section class="featured-grid">\n' + BLOCK + '\n      </section>',
    c, flags=re.DOTALL)
if new != c:
    open('index.html','w').write(new)
    print('Fixed cards:', missing)
    sys.exit(2)
PYEOF
          [ $? -eq 2 ] && git add index.html

          if ! git diff --cached --quiet; then
            git commit -m "auto-restore: protected pages and homepage cards"
            git push
          else
            echo "Nothing to restore"
          fi
