name: Protect Custom Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore protected pages
        run: |
          LAST_AUTHOR=$(git log -1 --format='%an')
          if [ "$LAST_AUTHOR" = "page-protector" ]; then
            echo "Skipping own commit"
            exit 0
          fi

          git config user.name "page-protector"
          git config user.email "protect@openai-tw.com"

          for F in "english/index.html" "srt/index.html" "etf/index.html" "五子棋/index.html"; do
            if [ ! -f "$F" ]; then
              echo "MISSING: $F"
              mkdir -p "$(dirname "$F")"
              git show origin/protected-pages:"$F" > "$F" 2>/dev/null && git add "$F" && echo "Restored: $F"
            fi
          done

          python3 .github/workflows/fix_cards.py
          [ $? -eq 2 ] && git add index.html

          if ! git diff --cached --quiet; then
            git commit -m "auto-restore: protected pages and homepage cards"
            git push
          else
            echo "Nothing to restore"
          fi
