name: Protect Custom Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore protected pages
        run: |
          LAST_AUTHOR=$(git log -1 --format='%an')
          if [ "$LAST_AUTHOR" = "page-protector" ]; then
            echo "Skipping own commit"
            exit 0
          fi

          git config user.name "page-protector"
          git config user.email "protect@openai-tw.com"

          NEED_COMMIT=false

          for F in "english/index.html" "srt/index.html" "etf/index.html" "五子棋/index.html"; do
            if [ ! -f "$F" ]; then
              echo "MISSING: $F — restoring from protected-pages branch"
              mkdir -p "$(dirname "$F")"
              git show origin/protected-pages:"$F" > "$F" 2>/dev/null && git add "$F" && echo "Restored: $F" && NEED_COMMIT=true
            fi
          done

          if [ "$NEED_COMMIT" = true ]; then
            git commit -m "auto-restore: protected pages"
            git push
          else
            echo "All protected pages intact"
          fi
