name: Protect Custom Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'   # 每 30 分鐘主動檢查一次

jobs:
  restore:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.author.name, 'page-protector')"
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.WORKFLOW_TOKEN }}

      - name: Restore protected files from protected-pages branch
        run: |
          git config user.name "page-protector"
          git config user.email "protect@openai-tw.com"

          # ── 1. Restore missing files from protected-pages branch ──
          PROTECTED_LIST="etf/index.html 五子棋/index.html english/index.html srt/index.html"
          for PROTECTED in $PROTECTED_LIST; do
            if [ ! -f "$PROTECTED" ]; then
              echo "MISSING: $PROTECTED — restoring from protected-pages branch..."
              DIR=$(dirname "$PROTECTED")
              mkdir -p "$DIR"
              git show origin/protected-pages:"$PROTECTED" > "$PROTECTED"
              git add "$PROTECTED"
              echo "Restored: $PROTECTED"
            else
              echo "OK: $PROTECTED"
            fi
          done

          # ── 2. Update protected-pages branch with latest versions ──
          # (only if files exist in main - keeps backup fresh)
          ALL_EXIST=true
          for PROTECTED in $PROTECTED_LIST; do
            [ ! -f "$PROTECTED" ] && ALL_EXIST=false
          done
          if [ "$ALL_EXIST" = true ]; then
            git fetch origin protected-pages
            NEEDS_UPDATE=false
            for PROTECTED in $PROTECTED_LIST; do
              if ! git diff origin/protected-pages:"$PROTECTED" -- "$PROTECTED" > /dev/null 2>&1; then
                NEEDS_UPDATE=true
              fi
            done
            if [ "$NEEDS_UPDATE" = true ]; then
              git checkout origin/protected-pages 2>/dev/null || true
              git checkout -B protected-pages origin/protected-pages
              for PROTECTED in $PROTECTED_LIST; do
                git show main:"$PROTECTED" > "$PROTECTED" 2>/dev/null || true
              done
              git add $PROTECTED_LIST 2>/dev/null || true
              if ! git diff --cached --quiet; then
                git commit -m "sync: update protected pages from main"
                git push origin protected-pages
              fi
              git checkout main
            fi
          fi

          # ── 3. Restore missing homepage cards ──
          python3 - << 'PYEOF'
import re, sys
content = open('index.html').read()
CARDS = '''        <a class="card" href="/etf/">
          <div class="name">ETF 投資工具</div>
          <div class="desc">配息試算、投資組合分析與 ETF 比較</div>
        </a>
        <a class="card" href="/五子棋/">
          <div class="name">五子棋 AI 對戰</div>
          <div class="desc">與 AI 對弈五子棋，四種難度，支援音效與悔棋</div>
        </a>
        <a class="card" href="/english/">
          <div class="name">🎓 AI School 英語學習</div>
          <div class="desc">英語、日語單字練習，雲端記錄，排行榜競賽</div>
        </a>
        <a class="card" href="/srt/">
          <div class="name">🎬 SRT 字幕產生器</div>
          <div class="desc">上傳影片自動生成 SRT 字幕，支援多語言</div>
        </a>'''
missing = []
if '/etf/' not in content: missing.append('etf')
if '五子棋' not in content: missing.append('五子棋')
if '/english/' not in content: missing.append('english')
if '/srt/' not in content: missing.append('srt')
if missing:
    print(f"Homepage missing cards: {missing} — restoring...")
    new_content = re.sub(
        r'<section class="featured-grid">.*?</section>',
        '<section class="featured-grid">\n' + CARDS + '\n      </section>',
        content, flags=re.DOTALL
    )
    if new_content != content:
        open('index.html', 'w').write(new_content)
        print('featured-grid restored')
        sys.exit(2)
    else:
        print('WARNING: featured-grid section not found')
        sys.exit(0)
else:
    print('All homepage cards present')
    sys.exit(0)
PYEOF

          PY_EXIT=$?
          if [ $PY_EXIT -eq 2 ]; then
            git add index.html
          fi

          # ── 4. Commit & push to main if anything staged ──
          if ! git diff --cached --quiet; then
            git commit -m "auto-restore: protected pages and homepage cards"
            git push origin main
            echo "Pushed restore commit to main"
          else
            echo "Nothing to restore - all good"
          fi
