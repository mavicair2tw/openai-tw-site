name: Protect Custom Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore protected pages and cards
        run: |
          LAST_AUTHOR=$(git log -1 --format='%an')
          if [ "$LAST_AUTHOR" = "page-protector" ]; then
            echo "Skipping own commit"
            exit 0
          fi

          git config user.name "page-protector"
          git config user.email "protect@openai-tw.com"

          NEED_COMMIT=false

          # 1. Restore deleted protected pages
          for F in "english/index.html" "srt/index.html" "etf/index.html" "五子棋/index.html" "ibelieve/index.html" "mp3player/index.html" "mp3player/qr.png" "mp3player/P1.mp3" "mp3player/P2.mp3" "assets/P1.mp3" "assets/P2.mp3"; do
            if [ ! -f "$F" ]; then
              echo "MISSING: $F — restoring from protected-pages branch"
              mkdir -p "$(dirname "$F")"
              git show origin/protected-pages:"$F" > "$F" 2>/dev/null && git add "$F" && echo "Restored: $F" && NEED_COMMIT=true
            fi
          done

          # 2. Ensure AI School card exists on main index.html
          if [ -f "index.html" ]; then
            if ! grep -q '/english/' index.html; then
              echo "AI School card missing from index.html — injecting"
              CARD='        <a class="card" href="/english/">\n          <div class="name">📖 AI School · 語言學習<\/div>\n          <div class="desc">英語 \/ 日語 \/ 法語字典、單字練習與 Quiz 測驗<\/div>\n        <\/a>'
              sed -i "s|<section class=\"featured-grid\">|<section class=\"featured-grid\">\n${CARD}|" index.html
              git add index.html && NEED_COMMIT=true
              echo "Injected AI School card"
            fi
          fi

          if [ "$NEED_COMMIT" = true ]; then
            git commit -m "auto-restore: protected pages and homepage cards"
            git push
          else
            echo "All protected pages and cards intact"
          fi
