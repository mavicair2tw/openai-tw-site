<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f7f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 700px;
    }
    h1 {
      color: #333;
      text-align: center;
      margin-bottom: 20px;
    }
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .tab {
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid #ccc;
      background: #f8f8f8;
      color: #333;
      cursor: pointer;
    }
    .tab.active {
      background: #4285F4;
      color: white;
      border-color: #4285F4;
    }
    #images-panel {
      display: none;
      width: 100%;
    }
    .saved-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-top: 16px;
    }
    .saved-card {
      border: 1px solid #eee;
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .saved-card img {
      width: 100%;
      display: block;
    }
    .saved-card pre {
      margin: 0;
      padding: 12px;
      font-size: 12px;
      white-space: pre-wrap;
      color: #444;
    }
    .demo-box h2 {
      margin: 0 0 10px;
      font-size: 28px;
    }
    .demo-box p {
      margin: 0;
      font-size: 16px;
      line-height: 1.5;
      opacity: 0.95;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Creator</h1>
    <p>Browse saved images and prompts.</p>

    <div class="tabs">
      <button class="tab active" id="images-tab" type="button">Images</button>
    </div>

    <div id="images-panel">
      <div id="saved-status">Loading saved images...</div>
      <div id="saved-grid" class="saved-grid"></div>
    </div>
  </div>

  <script>
    const imagesTab = document.getElementById('images-tab');
    const imagesPanel = document.getElementById('images-panel');
    const savedGrid = document.getElementById('saved-grid');
    const savedStatus = document.getElementById('saved-status');

    async function loadSavedImages() {
      savedStatus.textContent = 'Loading saved images...';
      savedGrid.innerHTML = '';
      try {
        const response = await fetch('/images');
        const data = await response.json();
        if (!data.success) throw new Error(data.error || 'Could not load images');
        if (!data.images.length) {
          savedStatus.textContent = 'No saved images yet.';
          return;
        }
        savedStatus.textContent = '';
        savedGrid.innerHTML = data.images.map(item => `
          <div class="saved-card">
            <img src="/saved_images/${item.file}" alt="${item.file}">
            <pre>${item.prompt || ''}</pre>
          </div>
        `).join('');
      } catch (error) {
        savedStatus.textContent = 'Could not load saved images.';
        console.error(error);
      }
    }

    imagesTab.addEventListener('click', loadSavedImages);
    loadSavedImages();
  </script>
</body>
</html>

    </div>
  </div>

  <script>
    const createTab = document.getElementById('create-tab');
    const imagesTab = document.getElementById('images-tab');
    const createPanel = document.getElementById('create-panel');
    const imagesPanel = document.getElementById('images-panel');
    const generateBtn = document.getElementById('generate-btn');
    const promptInput = document.getElementById('prompt-input');
    const loadingMessage = document.getElementById('loading-message');
    const imageDisplay = document.getElementById('generated-image');
    const demoBox = document.getElementById('demo-box');
    const scaleInputs = document.querySelectorAll('input[name="scale"]');
    const savedGrid = document.getElementById('saved-grid');
    const savedStatus = document.getElementById('saved-status');

    function getSelectedScale() {
      return document.querySelector('input[name="scale"]:checked')?.value || '1:1';
    }

    generateBtn.addEventListener('click', generateImage);
    createTab.addEventListener('click', () => showTab('create'));
    imagesTab.addEventListener('click', () => showTab('images'));

    function showTab(name) {
      const createActive = name === 'create';
      createPanel.style.display = createActive ? 'block' : 'none';
      imagesPanel.style.display = createActive ? 'none' : 'block';
      createTab.classList.toggle('active', createActive);
      imagesTab.classList.toggle('active', !createActive);
      if (!createActive) {
        loadSavedImages();
      }
    }

    async function loadSavedImages() {
      savedStatus.textContent = 'Loading saved images...';
      savedGrid.innerHTML = '';
      try {
        const response = await fetch('/images');
        const data = await response.json();
        if (!data.success) throw new Error(data.error || 'Could not load images');
        if (!data.images.length) {
          savedStatus.textContent = 'No saved images yet.';
          return;
        }
        savedStatus.textContent = '';
        savedGrid.innerHTML = data.images.map(item => `
          <div class="saved-card">
            <img src="/saved_images/${item.file}" alt="${item.file}">
            <pre>${item.prompt || ''}</pre>
          </div>
        `).join('');
      } catch (error) {
        savedStatus.textContent = 'Could not load saved images.';
        console.error(error);
      }
    }

    async function generateImage() {
      const prompt = promptInput.value.trim();
      const aspectRatio = getSelectedScale();
      if (!prompt) {
        alert('Please enter a prompt before generating.');
        return;
      }

      generateBtn.disabled = true;
      generateBtn.textContent = 'Processing...';
      loadingMessage.style.display = 'block';
      imageDisplay.src = '';
      imageDisplay.style.display = 'none';
      demoBox.style.display = 'none';

      try {
        const response = await fetch('/generate_image', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt, aspect_ratio: aspectRatio })
        });

        const data = await response.json();

        if (data.error) {
          alert('Error: ' + data.error);
        } else if (data.success && data.image_data) {
          imageDisplay.src = `data:${data.mime_type};base64,${data.image_data}`;
          imageDisplay.style.display = 'block';
        } else {
          alert('An unknown error occurred during image generation.');
        }
      } catch (error) {
        console.error('Fetch error:', error);
        alert('Could not connect to the server. Is the Flask backend running?');
      } finally {
        generateBtn.disabled = false;
        generateBtn.textContent = 'Generate Image';
        loadingMessage.style.display = 'none';
      }
    }
  </script>
</body>
</html>
