<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>台股即時報表 v2（15 分鐘更新）</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0b1020; --panel: #121a2f; --panel2: #18213a;
      --text: #e6edf3; --muted: #9fb0c3;
      --green: #22c55e; --red: #ef4444; --blue: #60a5fa;
      --border: #1f2a44;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(180deg, #0b1020 0%, #0a1226 100%);
      color: var(--text); padding: 20px; min-height: 100vh;
    }
    .wrap { max-width: 1200px; margin: 0 auto; }

    /* Top bar */
    .top-bar { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .logo { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 10px; border: 1px solid #2a3a5e; background: #101a33; color: #dbeafe; font-weight: 800; font-size: 13px; text-decoration: none; }
    .nav-tags { display: flex; flex-wrap: wrap; gap: 10px; }
    .nav-item { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
    .tag { display: inline-block; padding: 6px 12px; border-radius: 999px; border: 1px solid #2a3a5e; color: #cfe2ff; text-decoration: none; font-size: 12px; font-weight: 700; white-space: nowrap; }
    .tag.active { border-color: #60a5fa; background: #1a315f; color: #fff; }
    .tag-sub { color: #8fa3bf; font-size: 11px; padding-left: 8px; }

    /* Header */
    h1 { font-size: 22px; margin-bottom: 6px; }
    .meta { color: var(--muted); font-size: 13px; margin-bottom: 4px; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; background: #253252; color: #c7d5e5; margin-bottom: 6px; }
    .market-status { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; background: #1a2a4a; color: #93c5fd; margin-bottom: 16px; margin-left: 6px; }

    /* Overview bar chart */
    .overview-card {
      background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
      padding: 16px; margin-bottom: 20px;
    }
    .overview-card h2 { font-size: 14px; color: var(--muted); margin-bottom: 10px; }

    /* Cards grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }
    .card {
      background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
      padding: 14px; display: flex; flex-direction: column; gap: 8px;
    }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; }
    .card-label { font-size: 15px; font-weight: 700; }
    .card-symbol { font-size: 11px; color: var(--muted); background: var(--panel2); padding: 2px 8px; border-radius: 999px; }
    .card-type { font-size: 10px; color: var(--muted); }
    .card-price { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
    .card-change { font-size: 13px; display: flex; gap: 8px; }
    .card-chart { height: 60px; }

    /* Colors */
    .up { color: #ef4444; }
    .down { color: #22c55e; }
    .flat { color: var(--muted); }

    /* Summary */
    .summary-card {
      background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
      padding: 16px; line-height: 1.8; font-size: 14px;
    }
    .summary-card h2 { font-size: 14px; color: var(--muted); margin-bottom: 10px; }

    /* Source */
    .source { font-size: 12px; color: var(--muted); margin-bottom: 16px; }
    .source a { color: var(--blue); text-decoration: none; }

    /* Footer */
    .footer { text-align: center; color: var(--muted); font-size: 11px; margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--border); }

    @media (max-width: 600px) {
      .grid { grid-template-columns: 1fr; }
      h1 { font-size: 18px; }
    }
  </style>
</head>
<body>
<div class="wrap">

  <!-- Top bar -->
  <div class="top-bar">
    <a class="logo" href="https://openai-tw.com/">🧭 OpenClaw Market Hub</a>
    <div class="nav-tags">
      <div class="nav-item"><a class="tag" href="https://openai-tw.com/">Home</a><span class="tag-sub">Main Portal</span></div>
      <div class="nav-item"><a class="tag active" href="https://openai-tw.com/tw2/">台股 v2</a><span class="tag-sub">TW Market</span></div>
      <div class="nav-item"><a class="tag" href="https://openai-tw.com/us2/">美股 v2</a><span class="tag-sub">US Market</span></div>
      <div class="nav-item"><a class="tag" href="https://openai-tw.com/tw/">台股</a><span class="tag-sub">TW Classic</span></div>
      <div class="nav-item"><a class="tag" href="https://openai-tw.com/us/">美股</a><span class="tag-sub">US Classic</span></div>
    </div>
  </div>

  <!-- Header -->
  <h1>台股即時報表 v2</h1>
  <div class="meta" id="updated">載入中...</div>
  <div class="meta" id="viewCounter">點閱數：--</div>
  <div class="badge">紅色 = 上漲，綠色 = 下跌</div>
  <span class="market-status" id="marketStatus">檢查交易時段中...</span>
  <div class="source" id="dataSource">資料來源：臺灣證券交易所 MIS</div>

  <!-- Overview bar chart -->
  <div class="overview-card">
    <h2>📊 整體漲跌幅概覽</h2>
    <canvas id="overviewChart" height="70"></canvas>
  </div>

  <!-- Cards -->
  <div class="grid" id="cardGrid"></div>

  <!-- Summary -->
  <div class="summary-card">
    <h2>🤖 AI 市場摘要</h2>
    <div id="summary">載入摘要中...</div>
  </div>

  <div class="footer">
    OpenClaw Market Hub · 資料每 15 分鐘更新 · 頁面每 60 秒自動刷新 · 僅供參考，非投資建議
  </div>
</div>

<script>
  // View counter
  const pageKey = `views:${location.pathname}`;
  const pageViews = Number(localStorage.getItem(pageKey) || '0') + 1;
  localStorage.setItem(pageKey, String(pageViews));
  document.getElementById('viewCounter').textContent = `點閱數：${pageViews}`;

  function twMarketStatus() {
    const now = new Date();
    const tw = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Taipei' }));
    const day = tw.getDay();
    const minutes = tw.getHours() * 60 + tw.getMinutes();
    if (day === 0 || day === 6) return '台股休市（週末）';
    if (minutes >= 9 * 60 && minutes <= 13 * 60 + 30) return '🟢 台股交易中（09:00–13:30）';
    return '⏸ 台股非交易時段';
  }
  document.getElementById('marketStatus').textContent = twMarketStatus();

  function normalizeNumber(val) {
    if (typeof val === 'number') return val;
    if (typeof val === 'string') {
      const n = Number(val.replace(/,/g, '').replace(/%/g, '').trim());
      if (!isNaN(n)) return n;
    }
    return null;
  }
  function cls(v) { const n = normalizeNumber(v); if (n === null) return 'flat'; return n > 0 ? 'up' : n < 0 ? 'down' : 'flat'; }
  function fmt(v) { const n = normalizeNumber(v); if (n === null) return 'N/A'; return n.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 }); }
  function fmts(v, suffix = '') {
    const n = normalizeNumber(v); if (n === null) return 'N/A';
    const sign = n > 0 ? '+' : '';
    const f = Math.abs(n) < 1000 ? n.toFixed(2).replace(/\.00$/, '') : n.toLocaleString('en-US', { maximumFractionDigits: 2 });
    return `${sign}${f}${suffix}`;
  }

  const sparkCharts = {};
  function renderSparkline(canvasId, trendData, isPositive) {
    const ctx = document.getElementById(canvasId);
    if (!ctx || !trendData || !trendData.length) return;
    const color = isPositive ? 'rgba(239,68,68,0.9)' : 'rgba(34,197,94,0.9)';
    const fill = isPositive ? 'rgba(239,68,68,0.1)' : 'rgba(34,197,94,0.1)';
    if (sparkCharts[canvasId]) sparkCharts[canvasId].destroy();
    sparkCharts[canvasId] = new Chart(ctx, {
      type: 'line',
      data: {
        labels: trendData.map(t => t.time),
        datasets: [{ data: trendData.map(t => t.close), borderColor: color, backgroundColor: fill, borderWidth: 1.5, pointRadius: 0, fill: true, tension: 0.3 }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { enabled: false } },
        scales: { x: { display: false }, y: { display: false } },
        animation: false
      }
    });
  }

  function renderCards(items) {
    const grid = document.getElementById('cardGrid');
    grid.innerHTML = '';
    items.forEach((item, i) => {
      const changeClass = cls(item.change);
      const pctClass = cls(item.changePercent);
      const isPositive = normalizeNumber(item.changePercent) > 0;
      const canvasId = `spark_${i}`;
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-header">
          <div>
            <div class="card-label">${item.label}</div>
            <div class="card-type">${item.type || ''}</div>
          </div>
          <span class="card-symbol">${item.symbol}</span>
        </div>
        <div class="card-price">${fmt(item.price)}</div>
        <div class="card-change">
          <span class="${changeClass}">${fmts(item.change)}</span>
          <span class="${pctClass}">${fmts(item.changePercent, '%')}</span>
        </div>
        <div class="card-chart"><canvas id="${canvasId}"></canvas></div>
      `;
      grid.appendChild(card);
      setTimeout(() => renderSparkline(canvasId, item.trend, isPositive), 0);
    });
  }

  function renderOverview(items) {
    const vals = items.map(i => typeof i.changePercent === 'number' ? i.changePercent : 0);
    const colors = vals.map(v => v > 0 ? 'rgba(248,81,73,0.8)' : v < 0 ? 'rgba(34,197,94,0.8)' : 'rgba(159,176,195,0.5)');
    if (window._overviewChart) window._overviewChart.destroy();
    window._overviewChart = new Chart(document.getElementById('overviewChart'), {
      type: 'bar',
      data: { labels: items.map(i => i.label), datasets: [{ label: '漲跌幅 %', data: vals, backgroundColor: colors, borderRadius: 4 }] },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { labels: { color: '#e6edf3', font: { size: 11 } } } },
        scales: {
          x: { ticks: { color: '#c7d5e5', font: { size: 11 } }, grid: { color: 'rgba(255,255,255,0.04)' } },
          y: { ticks: { color: '#c7d5e5', font: { size: 11 } }, grid: { color: 'rgba(255,255,255,0.04)' } }
        }
      }
    });
  }

  function renderSummary(items) {
    const valid = items.filter(i => typeof i.changePercent === 'number');
    if (!valid.length) { document.getElementById('summary').innerHTML = '資料不足，建議先觀察。<br><span style="color:var(--muted)">※ 僅供參考，非投資建議。</span>'; return; }
    const avg = valid.reduce((a, b) => a + b.changePercent, 0) / valid.length;
    const up = valid.filter(i => i.changePercent > 0).length;
    const down = valid.filter(i => i.changePercent < 0).length;
    const topUp = valid.slice().sort((a, b) => b.changePercent - a.changePercent)[0];
    const topDown = valid.slice().sort((a, b) => a.changePercent - b.changePercent)[0];
    let tone = '中性偏觀望', action = '建議分批、控制部位，等待方向更明確。';
    if (avg > 0.6 && up > down) { tone = '偏多'; action = '可優先關注強勢標的，採分批布局並設停利停損。'; }
    else if (avg < -0.6 && down >= up) { tone = '偏空'; action = '建議降低追價，保留現金，等待止穩訊號。'; }
    document.getElementById('summary').innerHTML =
      `整體氣氛：<b>${tone}</b>（平均漲幅 ${avg.toFixed(2)}%，上漲 ${up} 檔 / 下跌 ${down} 檔）<br>` +
      `強勢：<span class="up">${topUp.label}（${fmts(topUp.changePercent, '%')}）</span>　弱勢：<span class="down">${topDown.label}（${fmts(topDown.changePercent, '%')}）</span><br>` +
      `投資建議：${action}<br><span style="color:var(--muted);font-size:12px">※ 以上為程式自動摘要，僅供參考，非投資建議。</span>`;
  }

  function loadData() {
    fetch('./data/latest.json?ts=' + Date.now())
      .then(r => r.json())
      .then(data => {
        const dateLabel = data?.dataDate ? `資料日期：${data.dataDate}` : '';
        const updateLabel = data?.updatedAt ? `最後同步：${data.updatedAt} (${data.timezone || 'Asia/Taipei'})` : '';
        document.getElementById('updated').textContent = [dateLabel, updateLabel].filter(Boolean).join('　｜　');

        const src = data?.source;
        if (src) {
          const sourceEl = document.getElementById('dataSource');
          const extra = src.remarks ? `（${src.remarks}）` : '';
          sourceEl.innerHTML = src.url
            ? `資料來源：<a href="${src.url}" target="_blank" rel="noreferrer">${src.name}</a>${extra}`
            : `資料來源：${src.name}${extra}`;
        }

        renderCards(data.items || []);
        renderOverview(data.items || []);
        renderSummary(data.items || []);
        document.getElementById('marketStatus').textContent = twMarketStatus();
      })
      .catch(() => { document.getElementById('updated').textContent = '讀取資料失敗'; });
  }

  loadData();
  setInterval(loadData, 60 * 1000);
</script>
</body>
</html>
