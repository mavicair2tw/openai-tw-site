<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1A3A6B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>監理所考試練習 | 長者駕照更新</title>
<meta name="description" content="專為70歲以上長者設計的監理所交通安全測驗練習系統，大字體、語音朗讀、三種練習模式。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy: #1A3A6B;
    --navy-dark: #122B52;
    --navy-light: #E8F0FE;
    --green: #155724;
    --green-bg: #D4EDDA;
    --green-border: #C3E6CB;
    --red: #721C24;
    --red-bg: #F8D7DA;
    --red-border: #F5C6CB;
    --yellow-bg: #FFF9E6;
    --yellow-border: #FFC107;
    --text: #1A1A1A;
    --text-muted: #555;
    --bg: #F4F3EE;
    --surface: #FFFFFF;
    --border: #D8D5CC;
    --radius: 14px;
    --font: 'Noto Sans TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif;
  }

  html, body {
    height: 100%;
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }

  #app {
    max-width: 680px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--bg);
    position: relative;
  }

  /* ── SCREENS ── */
  .screen { display: none; min-height: 100vh; }
  .screen.active { display: block; }

  /* ── HEADER ── */
  .header {
    background: var(--navy);
    color: white;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .header h1 { font-size: 20px; font-weight: 600; flex: 1; }
  .header .counter { font-size: 15px; opacity: 0.85; white-space: nowrap; }
  .back-btn {
    background: rgba(255,255,255,0.18);
    border: none;
    color: white;
    font-size: 24px;
    width: 46px;
    height: 46px;
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  .back-btn:hover { background: rgba(255,255,255,0.28); }

  /* ── HOME ── */
  .home-hero {
    background: var(--navy);
    color: white;
    padding: 36px 20px 44px;
    text-align: center;
  }
  .home-hero .car-icon { font-size: 56px; margin-bottom: 12px; }
  .home-hero h2 { font-size: 30px; font-weight: 700; margin-bottom: 6px; }
  .home-hero .subtitle { font-size: 18px; opacity: 0.85; margin-bottom: 16px; }
  .home-hero .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #FFC107;
    color: #1A1A1A;
    font-size: 15px;
    font-weight: 600;
    padding: 6px 16px;
    border-radius: 20px;
    margin-bottom: 6px;
  }

  .stats-row {
    display: flex;
    background: var(--surface);
    margin: 0 16px;
    margin-top: -16px;
    border-radius: var(--radius);
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    overflow: hidden;
  }
  .stat-cell {
    flex: 1;
    padding: 14px 8px;
    text-align: center;
    border-right: 1px solid var(--border);
  }
  .stat-cell:last-child { border-right: none; }
  .stat-num { font-size: 26px; font-weight: 700; color: var(--navy); }
  .stat-lbl { font-size: 13px; color: var(--text-muted); margin-top: 2px; }

  .section-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-muted);
    padding: 24px 16px 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .mode-cards { padding: 0 16px; display: flex; flex-direction: column; gap: 14px; }
  .mode-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 20px;
    border: 2px solid transparent;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .mode-card:hover, .mode-card:active { border-color: var(--navy); transform: translateY(-1px); }
  .mode-icon {
    width: 62px;
    height: 62px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    flex-shrink: 0;
  }
  .icon-blue { background: var(--navy-light); }
  .icon-green { background: #E6F4EA; }
  .icon-orange { background: #FEF3E2; }
  .mode-label { font-size: 22px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
  .mode-desc { font-size: 16px; color: var(--text-muted); }
  .mode-arrow { margin-left: auto; font-size: 28px; color: #CCC; flex-shrink: 0; }

  .tip-box {
    background: var(--navy-light);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin: 20px 16px 32px;
    font-size: 16px;
    color: var(--navy);
    display: flex;
    gap: 10px;
    align-items: flex-start;
    line-height: 1.5;
  }

  /* ── QUESTION SCREEN ── */
  .q-body { padding: 16px 16px 24px; }

  .progress-wrap {
    background: #E0DDD4;
    border-radius: 8px;
    height: 10px;
    margin-bottom: 6px;
    overflow: hidden;
  }
  .progress-fill {
    background: var(--navy);
    height: 10px;
    border-radius: 8px;
    transition: width 0.5s ease;
  }
  .progress-label { font-size: 15px; color: var(--text-muted); margin-bottom: 20px; }

  .cat-tag {
    display: inline-block;
    font-size: 13px;
    font-weight: 600;
    background: var(--navy-light);
    color: var(--navy);
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 14px;
  }

  .q-text {
    font-size: 26px;
    line-height: 1.65;
    color: var(--text);
    margin-bottom: 10px;
    font-weight: 500;
  }

  .speak-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: none;
    border: 2px solid var(--navy);
    color: var(--navy);
    border-radius: 10px;
    padding: 9px 18px;
    font-size: 17px;
    font-family: var(--font);
    cursor: pointer;
    margin-bottom: 22px;
    transition: background 0.15s;
  }
  .speak-btn:hover { background: var(--navy-light); }

  .q-image {
    width: 100%;
    max-height: 200px;
    object-fit: contain;
    border-radius: 10px;
    margin-bottom: 18px;
    background: #F0F0EA;
    display: none;
  }
  .q-image.has-image { display: block; }

  .choices { display: flex; flex-direction: column; gap: 14px; margin-bottom: 20px; }
  .choice-btn {
    background: #F5F4EE;
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    font-size: 21px;
    font-family: var(--font);
    text-align: left;
    cursor: pointer;
    transition: all 0.2s;
    color: var(--text);
    width: 100%;
    line-height: 1.45;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    min-height: 70px;
  }
  .choice-btn:hover:not(:disabled) { border-color: var(--navy); background: var(--navy-light); }
  .choice-btn:active:not(:disabled) { transform: scale(0.98); }
  .choice-btn:disabled { cursor: default; }

  .label-circle {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    font-weight: 700;
    flex-shrink: 0;
    transition: all 0.25s;
  }
  .choice-btn .choice-text { padding-top: 4px; }

  .choice-btn.correct {
    background: var(--green-bg);
    border-color: var(--green-border);
    color: var(--green);
  }
  .choice-btn.correct .label-circle { background: #28A745; color: white; }
  .choice-btn.wrong {
    background: var(--red-bg);
    border-color: var(--red-border);
    color: var(--red);
  }
  .choice-btn.wrong .label-circle { background: #DC3545; color: white; }

  .result-banner {
    border-radius: var(--radius);
    padding: 16px 20px;
    margin-bottom: 16px;
    font-size: 22px;
    font-weight: 700;
    display: none;
  }
  .result-banner.ok { background: var(--green-bg); color: var(--green); border: 2px solid var(--green-border); }
  .result-banner.bad { background: var(--red-bg); color: var(--red); border: 2px solid var(--red-border); }

  .explanation-box {
    background: var(--yellow-bg);
    border: 2px solid var(--yellow-border);
    border-radius: var(--radius);
    padding: 16px 18px;
    font-size: 18px;
    color: #444;
    line-height: 1.65;
    margin-bottom: 20px;
    display: none;
  }

  .next-btn {
    background: var(--navy);
    color: white;
    border: none;
    border-radius: var(--radius);
    padding: 20px;
    width: 100%;
    font-size: 22px;
    font-weight: 600;
    font-family: var(--font);
    cursor: pointer;
    transition: background 0.15s;
    display: none;
  }
  .next-btn:hover { background: var(--navy-dark); }
  .next-btn:active { transform: scale(0.99); }

  /* ── FINISH SCREEN ── */
  .finish-body { padding: 28px 16px 40px; text-align: center; }
  .score-ring {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background: var(--navy);
    color: white;
    margin: 0 auto 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .score-ring .big-num { font-size: 48px; font-weight: 700; line-height: 1; }
  .score-ring .small-lbl { font-size: 14px; opacity: 0.75; margin-top: 4px; }

  .finish-title { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
  .finish-sub { font-size: 18px; color: var(--text-muted); margin-bottom: 24px; }

  .advice-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 28px;
    text-align: left;
    border: 1px solid var(--border);
  }
  .advice-title { font-size: 17px; font-weight: 600; margin-bottom: 10px; }
  .advice-text { font-size: 17px; color: var(--text-muted); line-height: 1.7; }

  .finish-btns { display: flex; gap: 12px; }
  .btn-outline {
    flex: 1;
    padding: 18px;
    border-radius: var(--radius);
    font-size: 20px;
    font-weight: 600;
    font-family: var(--font);
    cursor: pointer;
    background: var(--surface);
    border: 2px solid var(--navy);
    color: var(--navy);
    transition: background 0.15s;
  }
  .btn-outline:hover { background: var(--navy-light); }
  .btn-primary {
    flex: 1;
    padding: 18px;
    border-radius: var(--radius);
    font-size: 20px;
    font-weight: 600;
    font-family: var(--font);
    cursor: pointer;
    background: var(--navy);
    border: none;
    color: white;
    transition: background 0.15s;
  }
  .btn-primary:hover { background: var(--navy-dark); }

  /* ── WRONG REVIEW LIST ── */
  .wrong-header { padding: 20px 16px 10px; font-size: 20px; font-weight: 600; }
  .wrong-empty { text-align: center; padding: 60px 20px; font-size: 20px; color: var(--text-muted); }
  .wrong-list { padding: 0 16px 24px; display: flex; flex-direction: column; gap: 10px; }
  .wrong-item {
    background: var(--surface);
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    border: 2px solid var(--red-border);
  }
  .wrong-item .wi-text { flex: 1; font-size: 17px; line-height: 1.4; color: var(--text); }
  .wrong-badge {
    background: #DC3545;
    color: white;
    font-size: 13px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 20px;
    flex-shrink: 0;
  }

  /* ── SETTINGS ── */
  .settings-body { padding: 16px; }
  .settings-row {
    background: var(--surface);
    border-radius: 12px;
    padding: 18px 16px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 14px;
    border: 1px solid var(--border);
  }
  .settings-row .sr-label { flex: 1; font-size: 20px; font-weight: 500; }
  .settings-row .sr-desc { font-size: 15px; color: var(--text-muted); }

  /* Toggle */
  .toggle {
    position: relative;
    width: 56px;
    height: 30px;
    flex-shrink: 0;
  }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle-slider {
    position: absolute;
    inset: 0;
    background: #CCC;
    border-radius: 30px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .toggle-slider::before {
    content: '';
    position: absolute;
    width: 22px; height: 22px;
    left: 4px; top: 4px;
    background: white;
    border-radius: 50%;
    transition: transform 0.2s;
  }
  .toggle input:checked + .toggle-slider { background: var(--navy); }
  .toggle input:checked + .toggle-slider::before { transform: translateX(26px); }

  /* ── FONT SIZE SLIDER ── */
  input[type=range] { width: 100%; accent-color: var(--navy); }

  /* ── SPEAKING INDICATOR ── */
  .speaking-dot {
    display: inline-block;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #FFC107;
    margin-left: 6px;
    animation: pulse 1s infinite;
    vertical-align: middle;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .speaking-dot.active { opacity: 1; }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.5)} }

  /* ── FOOTER ── */
  .site-footer {
    text-align: center;
    padding: 20px 16px;
    font-size: 14px;
    color: var(--text-muted);
    border-top: 1px solid var(--border);
    margin-top: 8px;
  }
  .site-footer a { color: var(--navy); text-decoration: none; }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141414;
      --surface: #1E1E1E;
      --text: #F0F0F0;
      --text-muted: #999;
      --border: #333;
    }
    .mode-card { box-shadow: none; }
    .choice-btn { background: #252525; }
    .choice-btn:hover:not(:disabled) { background: #1A3060; }
  }
</style>
</head>
<body>
<div id="app">

<!-- ══════════════════════════════════
     HOME SCREEN
══════════════════════════════════ -->
<div id="screen-home" class="screen active">
  <div class="home-hero">
    <div class="car-icon">🚗</div>
    <h2>監理所考試練習</h2>
    <p class="subtitle">專為長者設計・大字清晰・語音朗讀</p>
    <span class="badge">🔊 內建語音朗讀</span>
  </div>

  <div class="stats-row">
    <div class="stat-cell">
      <div class="stat-num" id="stat-done">0</div>
      <div class="stat-lbl">已練題數</div>
    </div>
    <div class="stat-cell">
      <div class="stat-num" id="stat-wrong">0</div>
      <div class="stat-lbl">錯題數</div>
    </div>
    <div class="stat-cell">
      <div class="stat-num" id="stat-rate">—</div>
      <div class="stat-lbl">答對率</div>
    </div>
  </div>

  <div class="section-title">選擇練習模式</div>
  <div class="mode-cards">
    <div class="mode-card" onclick="startMode('quick')" role="button" tabindex="0">
      <div class="mode-icon icon-blue">⚡</div>
      <div>
        <div class="mode-label">快速通關</div>
        <div class="mode-desc">最重要的必考題，快速熟悉</div>
      </div>
      <div class="mode-arrow">›</div>
    </div>
    <div class="mode-card" onclick="startMode('mock')" role="button" tabindex="0">
      <div class="mode-icon icon-green">📋</div>
      <div>
        <div class="mode-label">模擬考試</div>
        <div class="mode-desc">模擬真實測驗，計算分數</div>
      </div>
      <div class="mode-arrow">›</div>
    </div>
    <div class="mode-card" onclick="startMode('wrong')" role="button" tabindex="0" id="wrong-card">
      <div class="mode-icon icon-orange">🔁</div>
      <div>
        <div class="mode-label">錯題複習</div>
        <div class="mode-desc" id="wrong-desc">先練習後才會出現</div>
      </div>
      <div class="mode-arrow">›</div>
    </div>
  </div>

  <div class="tip-box">
    <span>💡</span>
    <span>建議：每天練習15分鐘，大約一週後成績就會進步！點選答案後可聽語音說明。</span>
  </div>
  <div class="site-footer">
    <a href="https://openai-tw.com">openai-tw.com</a> · 長者駕照更新練習系統 v1.0
  </div>
</div>

<!-- ══════════════════════════════════
     QUESTION SCREEN
══════════════════════════════════ -->
<div id="screen-question" class="screen">
  <div class="header">
    <button class="back-btn" onclick="goHome()" aria-label="返回首頁">←</button>
    <h1 id="q-mode-label">快速通關</h1>
    <span class="counter" id="q-counter">1 / 10</span>
  </div>

  <div class="q-body">
    <div class="progress-wrap">
      <div class="progress-fill" id="q-progress" style="width:5%"></div>
    </div>
    <div class="progress-label" id="q-progress-label">第 1 題，共 10 題</div>

    <span class="cat-tag" id="q-cat">交通規則</span>
    <img class="q-image" id="q-image" src="" alt="題目圖片">
    <div class="q-text" id="q-text">題目載入中...</div>

    <button class="speak-btn" onclick="speakCurrent()" id="speak-btn">
      🔊 朗讀題目
      <span class="speaking-dot" id="speaking-dot"></span>
    </button>

    <div class="choices" id="q-choices"></div>

    <div class="result-banner" id="q-result"></div>
    <div class="explanation-box" id="q-explanation"></div>
    <button class="next-btn" id="q-next" onclick="nextQuestion()">下一題 →</button>
  </div>
</div>

<!-- ══════════════════════════════════
     FINISH SCREEN
══════════════════════════════════ -->
<div id="screen-finish" class="screen">
  <div class="header">
    <button class="back-btn" onclick="goHome()">←</button>
    <h1>練習結果</h1>
  </div>
  <div class="finish-body">
    <div class="score-ring">
      <div class="big-num" id="f-score">80</div>
      <div class="small-lbl">分</div>
    </div>
    <div class="finish-title" id="f-title">做得很好！</div>
    <div class="finish-sub" id="f-sub">共10題，答對8題</div>
    <div class="advice-card">
      <div class="advice-title">💬 建議</div>
      <div class="advice-text" id="f-advice">繼續加油！</div>
    </div>
    <div class="finish-btns">
      <button class="btn-outline" onclick="goHome()">回首頁</button>
      <button class="btn-primary" onclick="repeatMode()">再練一次</button>
    </div>
  </div>
</div>

</div><!-- #app -->

<script>
/* ─────────────────────────────────────────────────
   題庫（100題，涵蓋交通標誌、規則、安全駕駛）
───────────────────────────────────────────────── */
const QUESTIONS = [
  // ── 交通規則 ──
  { id:1,  cat:'交通規則', key:true,  text:'看到紅燈時，應該怎麼做？',
    ch:['慢慢通過即可','停車等待，綠燈再走','按喇叭後通過','左轉不用等紅燈'],
    ans:1, exp:'紅燈必須完全停車等待。闖紅燈會被罰款 1,800～5,400 元並記點，也非常危險。' },

  { id:2,  cat:'交通規則', key:true,  text:'行人走在斑馬線上時，駕駛人應該怎麼做？',
    ch:['按喇叭提醒行人快點','慢慢通過斑馬線','必須停車，禮讓行人通過','繞道從旁邊過去'],
    ans:2, exp:'行人在斑馬線上有優先通行權，駕駛人必須完全停車等待行人通過後才能前進，違者罰款1,200元。' },

  { id:3,  cat:'交通規則', key:true,  text:'看到救護車或消防車鳴笛時，應該怎麼做？',
    ch:['加速離開讓路','立刻靠路邊停車讓路','繼續正常行駛','跟著救護車走'],

/* ─────────────────────────────────────────────────
   狀態管理
───────────────────────────────────────────────── */
let state = {
  mode: 'quick',
  queue: [],
  idx: 0,
  correctCount: 0,
  answered: false,
  speaking: false
};

function getStats() { return JSON.parse(localStorage.getItem('driverStats') || '{"done":0,"correct":0}'); }
function saveStats(c, t) {
  const s = getStats();
  s.done += t; s.correct += c;
  localStorage.setItem('driverStats', JSON.stringify(s));
}
function getWrongIds() { return JSON.parse(localStorage.getItem('driverWrong') || '[]'); }
function addWrong(id) {
  const w = getWrongIds();
  if (!w.includes(id)) { w.push(id); localStorage.setItem('driverWrong', JSON.stringify(w)); }
}
function removeWrong(id) {
  const w = getWrongIds().filter(x => x !== id);
  localStorage.setItem('driverWrong', JSON.stringify(w));
}

function refreshHome() {
  const s = getStats();
  const wrongCount = getWrongIds().length;
  document.getElementById('stat-done').textContent = s.done;
  document.getElementById('stat-wrong').textContent = wrongCount;
  document.getElementById('stat-rate').textContent = s.done > 0 ? Math.round(s.correct / s.done * 100) + '%' : '—';
  const desc = document.getElementById('wrong-desc');
  desc.textContent = wrongCount > 0 ? `你有 ${wrongCount} 題需要複習` : '先練習後才會出現';
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
  window.scrollTo(0, 0);
}

function goHome() {
  stopSpeak();
  refreshHome();
  showScreen('home');
}

/* ─────────────────────────────────────────────────
   語音
───────────────────────────────────────────────── */
function speak(text, onend) {
  if (!window.speechSynthesis) return;
  stopSpeak();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-TW';
  u.rate = 0.88;
  u.pitch = 1.0;
  const dot = document.getElementById('speaking-dot');
  if (dot) { dot.classList.add('active'); state.speaking = true; }
  u.onend = u.onerror = () => {
    if (dot) dot.classList.remove('active');
    state.speaking = false;
    if (onend) onend();
  };
  window.speechSynthesis.speak(u);
}
function stopSpeak() {
  window.speechSynthesis && window.speechSynthesis.cancel();
  const dot = document.getElementById('speaking-dot');
  if (dot) dot.classList.remove('active');
  state.speaking = false;
}
function speakCurrent() {
  const q = state.queue[state.idx];
  if (!q) return;
  const allText = `${q.text}。選項A：${q.ch[0]}。選項B：${q.ch[1]}。選項C：${q.ch[2]}。選項D：${q.ch[3]}`;
  speak(allText);
}

/* ─────────────────────────────────────────────────
   模式啟動
───────────────────────────────────────────────── */
const MODE_LABELS = { quick: '⚡ 快速通關', mock: '📋 模擬考試', wrong: '🔁 錯題複習' };
const MODE_COUNT  = { quick: 20, mock: 50, wrong: 999 };

function startMode(mode) {
  stopSpeak();
  let pool;
  if (mode === 'quick') {
    pool = QUESTIONS.filter(q => q.key).sort(() => Math.random() - 0.5).slice(0, Math.min(20, QUESTIONS.filter(q=>q.key).length));
  } else if (mode === 'mock') {
    pool = [...QUESTIONS].sort(() => Math.random() - 0.5).slice(0, 50);
  } else {
    const ids = getWrongIds();
    if (!ids.length) { alert('還沒有錯題！\n請先進行「快速通關」或「模擬考試」練習。'); return; }
    pool = QUESTIONS.filter(q => ids.includes(q.id)).sort(() => Math.random() - 0.5);
    if (!pool.length) { alert('錯題已全部複習完成！繼續保持！'); return; }
  }
  state.mode = mode;
  state.queue = pool;
  state.idx = 0;
  state.correctCount = 0;
  state.answered = false;
  document.getElementById('q-mode-label').textContent = MODE_LABELS[mode] || mode;
  showScreen('question');
  loadQuestion();
}

function repeatMode() { startMode(state.mode); }

/* ─────────────────────────────────────────────────
   題目顯示
───────────────────────────────────────────────── */
function loadQuestion() {
  const q = state.queue[state.idx];
  const total = state.queue.length;
  const pct = Math.round((state.idx / total) * 100);

  document.getElementById('q-progress').style.width = pct + '%';
  document.getElementById('q-counter').textContent = `${state.idx + 1} / ${total}`;
  document.getElementById('q-progress-label').textContent = `第 ${state.idx + 1} 題，共 ${total} 題`;
  document.getElementById('q-cat').textContent = q.cat;
  document.getElementById('q-text').textContent = q.text;

  // image
  const img = document.getElementById('q-image');
  if (q.img) { img.src = q.img; img.classList.add('has-image'); }
  else { img.src = ''; img.classList.remove('has-image'); }

  // choices
  const choicesEl = document.getElementById('q-choices');
  choicesEl.innerHTML = '';
  const labels = ['A', 'B', 'C', 'D'];
  q.ch.forEach((text, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.setAttribute('aria-label', `選項${labels[i]}：${text}`);
    btn.innerHTML = `<div class="label-circle">${labels[i]}</div><span class="choice-text">${text}</span>`;
    btn.addEventListener('click', () => handleAnswer(i));
    choicesEl.appendChild(btn);
  });

  document.getElementById('q-result').style.display = 'none';
  document.getElementById('q-result').className = 'result-banner';
  document.getElementById('q-explanation').style.display = 'none';
  document.getElementById('q-next').style.display = 'none';
  state.answered = false;

  setTimeout(() => speak(q.text), 400);
}

function handleAnswer(chosen) {
  if (state.answered) return;
  state.answered = true;
  const q = state.queue[state.idx];
  const isCorrect = chosen === q.ans;
  if (isCorrect) state.correctCount++;

  const btns = document.querySelectorAll('.choice-btn');
  btns.forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.ans) btn.classList.add('correct');
    else if (i === chosen && !isCorrect) btn.classList.add('wrong');
  });

  const resultEl = document.getElementById('q-result');
  const explEl = document.getElementById('q-explanation');
  resultEl.style.display = 'block';

  let speakMsg;
  if (isCorrect) {
    resultEl.className = 'result-banner ok';
    resultEl.textContent = '✅ 答對了！很好！';
    speakMsg = '答對了！很好！' + q.exp;
    if (state.mode === 'wrong') removeWrong(q.id);
  } else {
    resultEl.className = 'result-banner bad';
    resultEl.textContent = `❌ 答錯了。正確答案是：${['A','B','C','D'][q.ans]}. ${q.ch[q.ans]}`;
    speakMsg = `答錯了。正確答案是：${q.ch[q.ans]}。${q.exp}`;
    if (state.mode !== 'wrong') addWrong(q.id);
  }

  explEl.style.display = 'block';
  explEl.textContent = '📖 說明：' + q.exp;

  const nextBtn = document.getElementById('q-next');
  nextBtn.style.display = 'block';
  const isLast = state.idx === state.queue.length - 1;
  nextBtn.textContent = isLast ? '查看結果 →' : '下一題 →';

  speak(speakMsg);
}

function nextQuestion() {
  stopSpeak();
  state.idx++;
  if (state.idx >= state.queue.length) {
    showFinish();
  } else {
    loadQuestion();
  }
}

/* ─────────────────────────────────────────────────
   完成畫面
───────────────────────────────────────────────── */
function showFinish() {
  const total = state.queue.length;
  const correct = state.correctCount;
  const score = Math.round(correct / total * 100);
  saveStats(correct, total);

  document.getElementById('f-score').textContent = score;

  let title, sub, advice, speakText;
  if (score >= 85) {
    title = '🎉 太棒了！可以去考試了！';
    sub = `共 ${total} 題，答對 ${correct} 題`;
    advice = `您的成績超過 85 分及格標準，非常好！建議再練習一次鞏固記憶，就可以去監理所考試了。`;
  } else if (score >= 70) {
    title = '👍 不錯！再加油一下！';
    sub = `共 ${total} 題，答對 ${correct} 題，還差一點`;
    advice = `距離 85 分及格還有進步空間。建議用「錯題複習」重點練習答錯的題目，相信你很快就能過關！`;
  } else {
    title = '💪 繼續練習，一定可以！';
    sub = `共 ${total} 題，答對 ${correct} 題`;
    advice = `不要灰心！多練習幾次就會熟悉。建議從「快速通關」開始，每天練習10分鐘，一週內成績就會進步。`;
  }

  document.getElementById('f-title').textContent = title;
  document.getElementById('f-sub').textContent = sub;
  document.getElementById('f-advice').textContent = advice;

  speakText = `${title}，${sub}。${advice}`;
  showScreen('finish');
  setTimeout(() => speak(speakText), 500);
}

/* ─────────────────────────────────────────────────
   鍵盤支援（A/B/C/D 鍵作答）
───────────────────────────────────────────────── */
document.addEventListener('keydown', (e) => {
  const k = e.key.toUpperCase();
  if (['A','B','C','D'].includes(k) && document.getElementById('screen-question').classList.contains('active')) {
    const i = ['A','B','C','D'].indexOf(k);
    if (!state.answered) {
      const btns = document.querySelectorAll('.choice-btn');
      if (btns[i]) btns[i].click();
    }
  }
  if (e.key === 'Enter' && document.getElementById('screen-question').classList.contains('active')) {
    const next = document.getElementById('q-next');
    if (next.style.display !== 'none') nextQuestion();
  }
});

/* ─────────────────────────────────────────────────
   初始化
───────────────────────────────────────────────── */
refreshHome();
</script>
